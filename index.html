document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

t */\n@font-face {\n  font-family: 'Sarabun';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"717a8783-ec62-42c4-98df-cb1625fbcf2e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Sarabun';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"f642c450-4d15-47df-9f24-239f62236d0d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* thai */\n@font-face {\n  font-family: 'Sarabun';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"28c80178-a4b3-4f41-a0eb-5fddd3bf65c7\") format('woff2');\n  unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Sarabun';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"0423467f-efdd-4e65-8479-28e3f032278c\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Sarabun';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"71f63896-6ac1-4402-a1c2-e44df42697bc\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Sarabun';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"b7e2992f-b1de-4873-97de-9a75c8e196e0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nhtml,body{margin:0;padding:0}\nbody{background:#f3f1ea;font-family:'Sarabun',system-ui,-apple-system,sans-serif;color:#191813;-webkit-text-size-adjust:100%;text-wrap:pretty}\na{color:#1f5f4f;text-decoration:none}\na:hover{color:#153f34}\nbutton,input{font-family:inherit}\n@keyframes hubIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n<\u002Fstyle>\n<script src=\"97fe6ea7-32b4-40b2-b4c3-42c0878ffa1c\"><\u002Fscript>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:#f3f1ea\">\n\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"max-width:860px;margin:0 auto;padding:28px 18px 64px\">\n\n  <div style=\"display:flex;flex-direction:column;gap:6px;padding:4px 2px 20px\">\n    <div style=\"font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8a8577;font-weight:600\">Tax Exam Library<\u002Fdiv>\n    <h1 style=\"margin:0;font-size:29px;line-height:1.3;font-weight:700;letter-spacing:-.01em\">คลังข้อสอบภาษีเงินได้ รวมทุกชุด<\u002Fh1>\n    <p style=\"margin:0;font-size:15px;color:#6c6a60;line-height:1.6\">{{ libMeta }}<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:#e8e5dc;border-radius:14px;margin-bottom:18px\">\n    <sc-for list=\"{{ groupTabs }}\" as=\"g\" hint-placeholder-count=\"2\">\n      <button sc-camel-on-click=\"{{ g.onClick }}\" style=\"{{ g.style }}\">\n        <span style=\"font-size:15.5px;font-weight:700;line-height:1.3\">{{ g.name }}<\u002Fspan>\n        <span style=\"{{ g.subStyle }}\">{{ g.sub }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px\">\n    <div style=\"background:#fff;border:1px solid rgba(25,24,19,.09);border-radius:14px;padding:14px 16px\">\n      <div style=\"font-size:12.5px;color:#8a8577;font-weight:500\">ทำไปแล้ว<\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:5px;margin-top:3px\"><span style=\"font-size:26px;font-weight:700;line-height:1\">{{ statDone }}<\u002Fspan><span style=\"font-size:13px;color:#8a8577\">/ {{ statTotal }} ข้อ<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid rgba(25,24,19,.09);border-radius:14px;padding:14px 16px\">\n      <div style=\"font-size:12.5px;color:#8a8577;font-weight:500\">ความแม่นยำ<\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:5px;margin-top:3px\"><span style=\"font-size:26px;font-weight:700;line-height:1\">{{ statAcc }}<\u002Fspan><span style=\"font-size:13px;color:#8a8577\">%<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid rgba(25,24,19,.09);border-radius:14px;padding:14px 16px\">\n      <div style=\"font-size:12.5px;color:#8a8577;font-weight:500\">ตอบผิด · ติดดาว<\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:5px;margin-top:3px\"><span style=\"font-size:26px;font-weight:700;line-height:1\">{{ statWrong }}<\u002Fspan><span style=\"font-size:13px;color:#8a8577\">· {{ statStar }} ข้อ<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;gap:10px\">\n    <input value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" placeholder=\"{{ searchHint }}\" style=\"flex:1;min-width:0;padding:13px 15px;font-size:15px;border:1px solid rgba(25,24,19,.14);border-radius:12px;background:#fff;color:#191813;outline:none\">\n    <sc-if value=\"{{ hasQuery }}\">\n      <button sc-camel-on-click=\"{{ clearQuery }}\" style=\"padding:0 16px;font-size:14px;font-weight:500;border:1px solid rgba(25,24,19,.14);border-radius:12px;background:#fff;color:#6c6a60;cursor:pointer\">ล้าง<\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ hasQuery }}\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:14px\">\n      <div style=\"font-size:13px;color:#8a8577;padding:0 2px\">{{ resultCount }}<\u002Fdiv>\n      <sc-for list=\"{{ results }}\" as=\"r\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ r.onClick }}\" style=\"text-align:left;background:#fff;border:1px solid rgba(25,24,19,.09);border-radius:12px;padding:13px 15px;cursor:pointer;display:flex;flex-direction:column;gap:5px\" style-hover=\"border-color:rgba(25,24,19,.3)\">\n          <span style=\"{{ r.tagStyle }}\">{{ r.tag }}<\u002Fspan>\n          <span style=\"font-size:14.5px;line-height:1.55;color:#191813\">{{ r.text }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ noQuery }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px\">\n      <button sc-camel-on-click=\"{{ startWrong }}\" style=\"text-align:left;background:#fff;border:1px solid rgba(25,24,19,.09);border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:3px\" style-hover=\"border-color:rgba(166,40,40,.4)\">\n        <span style=\"font-size:15px;font-weight:600;color:#191813\">ทบทวนข้อที่เคยตอบผิด<\u002Fspan>\n        <span style=\"font-size:13px;color:#8a8577\">{{ wrongLabel }}<\u002Fspan>\n      <\u002Fbutton>\n      <button sc-camel-on-click=\"{{ startStar }}\" style=\"text-align:left;background:#fff;border:1px solid rgba(25,24,19,.09);border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:3px\" style-hover=\"border-color:rgba(184,134,11,.5)\">\n        <span style=\"font-size:15px;font-weight:600;color:#191813\">ทบทวนข้อที่ติดดาว<\u002Fspan>\n        <span style=\"font-size:13px;color:#8a8577\">{{ starLabel }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n\n    <sc-for list=\"{{ series }}\" as=\"sr\" hint-placeholder-count=\"3\">\n      <div>\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 2px 12px\">\n          <h2 style=\"margin:0;font-size:17px;font-weight:700\">{{ sr.name }}<\u002Fh2>\n          <span style=\"font-size:12.5px;color:#8a8577;white-space:nowrap\">{{ sr.meta }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <sc-for list=\"{{ sr.sets }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <div style=\"background:#fff;border:1px solid rgba(25,24,19,.09);border-radius:16px;padding:18px 18px 16px\">\n              <div style=\"display:flex;gap:13px;align-items:flex-start\">\n                <div style=\"{{ s.numStyle }}\">{{ s.num }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:12.5px;color:#8a8577;font-weight:500\">{{ s.scope }}<\u002Fdiv>\n                  <div style=\"font-size:16.5px;font-weight:600;line-height:1.45;margin-top:1px\">{{ s.title }}<\u002Fdiv>\n                  <div style=\"font-size:13px;color:#8a8577;margin-top:3px\">{{ s.meta }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height:6px;border-radius:99px;background:#eceae3;margin:14px 0 13px;overflow:hidden\">\n                <div style=\"{{ s.barStyle }}\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n                <sc-for list=\"{{ s.chips }}\" as=\"c\" hint-placeholder-count=\"4\">\n                  <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.style }}\" style-hover=\"filter:brightness(.96)\">{{ c.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n                <button sc-camel-on-click=\"{{ s.openKey }}\" style=\"{{ s.keyStyle }}\" style-hover=\"filter:brightness(.96)\">ดูเฉลย<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <sc-if value=\"{{ hasHistory }}\">\n      <div>\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin:30px 2px 12px\">\n          <h2 style=\"margin:0;font-size:17px;font-weight:700\">สถิติย้อนหลัง<\u002Fh2>\n          <button sc-camel-on-click=\"{{ clearHistory }}\" style=\"background:none;border:none;font-size:12.5px;color:#8a8577;cursor:pointer;padding:4px\">ล้างประวัติ<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid rgba(25,24,19,.09);border-radius:16px;overflow:hidden\">\n          <sc-for list=\"{{ history }}\" as=\"h\" hint-placeholder-count=\"3\">\n            <div style=\"{{ h.rowStyle }}\">\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font-size:14.5px;font-weight:500;line-height:1.4\">{{ h.title }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#8a8577;margin-top:2px\">{{ h.when }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"text-align:right;flex:none\">\n                <div style=\"font-size:15.5px;font-weight:700;line-height:1.2\">{{ h.score }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#8a8577\">{{ h.pct }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ hasProgress }}\">\n      <div style=\"margin-top:26px;text-align:center\">\n        <button sc-camel-on-click=\"{{ resetAll }}\" style=\"background:none;border:none;font-size:12.5px;color:#a8a396;cursor:pointer;padding:8px 12px\">ล้างข้อมูลการทำข้อสอบทั้งหมด<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isQuiz }}\">\n<div style=\"min-height:100vh;display:flex;flex-direction:column\">\n  <div style=\"position:sticky;top:0;z-index:20;background:rgba(243,241,234,.94);backdrop-filter:blur(8px);border-bottom:1px solid rgba(25,24,19,.08)\">\n    <div style=\"max-width:860px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px\">\n      <button sc-camel-on-click=\"{{ goHome }}\" style=\"flex:none;width:40px;height:40px;border-radius:11px;border:1px solid rgba(25,24,19,.12);background:#fff;color:#191813;font-size:17px;cursor:pointer;line-height:1\" style-hover=\"background:#f7f5ef\">←<\u002Fbutton>\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ sessionTitle }}<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#8a8577\">ข้อ {{ posLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ toggleStar }}\" style=\"{{ starBtnStyle }}\" title=\"ติดดาวข้อนี้\">★<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ toggleGrid }}\" style=\"{{ gridBtnStyle }}\" title=\"ตารางเลขข้อ\">▦<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"height:3px;background:#e4e1d8\"><div style=\"{{ progressStyle }}\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ gridOpen }}\">\n    <div style=\"max-width:860px;margin:0 auto;width:100%;padding:14px 14px 0;box-sizing:border-box\">\n      <div style=\"background:#fff;border:1px solid rgba(25,24,19,.09);border-radius:16px;padding:14px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px;font-size:12px;color:#6c6a60\">\n          <span style=\"display:flex;align-items:center;gap:5px\"><span style=\"width:10px;height:10px;border-radius:3px;background:#14713f;display:inline-block\"><\u002Fspan>ถูก<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:5px\"><span style=\"width:10px;height:10px;border-radius:3px;background:#a62828;display:inline-block\"><\u002Fspan>ผิด<\u002Fspan>\n le=\"{{ o.textStyle }}\">{{ o.text }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ answered }}\">\n        <div style=\"margin-top:18px\">\n          <div style=\"{{ verdictStyle }}\">{{ verdictText }}<\u002Fdiv>\n          <div style=\"margin-top:12px;background:#faf8f2;border:1px solid rgba(25,24,19,.08);border-radius:13px;padding:15px 16px\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin-bottom:6px\">\n              <span style=\"font-size:12px;font-weight:600;color:#8a8577;letter-spacing:.04em\">คำอธิบาย<\u002Fspan>\n              <span style=\"{{ refStyle }}\">{{ refText }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"{{ explStyle }}\">{{ explanation }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(243,241,234,.95);backdrop-filter:blur(8px);border-top:1px solid rgba(25,24,19,.08);padding-bottom:env(safe-area-inset-bottom)\">\n    <div style=\"max-width:860px;margin:0 auto;padding:12px 14px;display:flex;gap:10px\">\n      <button sc-camel-on-click=\"{{ prev }}\" style=\"{{ prevStyle }}\">ข้อก่อนหน้า<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ next }}\" style=\"{{ nextStyle }}\" style-hover=\"filter:brightness(1.08)\">{{ nextLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isKey }}\">\n<div style=\"min-height:100vh\">\n  <div style=\"position:sticky;top:0;z-index:20;background:rgba(243,241,234,.95);backdrop-filter:blur(8px);border-bottom:1px solid rgba(25,24,19,.08)\">\n    <div style=\"max-width:860px;margin:0 auto;padding:10px 14px 10px;display:flex;align-items:center;gap:10px\">\n      <button sc-camel-on-click=\"{{ goHome }}\" style=\"flex:none;width:40px;height:40px;border-radius:11px;border:1px solid rgba(25,24,19,.12);background:#fff;color:#191813;font-size:17px;cursor:pointer;line-height:1\" style-hover=\"background:#f7f5ef\">←<\u002Fbutton>\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">เฉลย · {{ keyTitle }}<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#8a8577\">{{ keyMeta }}<\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ practiceThis }}\" style=\"{{ practiceStyle }}\" style-hover=\"filter:brightness(1.08)\">ทำชุดนี้<\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{ hasFilters }}\">\n      <div style=\"max-width:860px;margin:0 auto;padding:0 14px 10px;display:flex;gap:6px;overflow-x:auto\">\n        <sc-for list=\"{{ filterTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"max-width:860px;margin:0 auto;padding:16px 14px 64px;display:flex;flex-direction:column;gap:12px\">\n    <sc-for list=\"{{ keyItems }}\" as=\"x\" hint-placeholder-count=\"4\">\n      <div style=\"background:#fff;border:1px solid rgba(25,24,19,.09);border-radius:16px;padding:18px 18px 16px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:8px\">\n          <span style=\"{{ x.numStyle }}\">ข้อ {{ x.id }}<\u002Fspan>\n          <span style=\"font-size:12px;color:#8a8577\">{{ x.section }}<\u002Fspan>\n          <span style=\"{{ x.levelStyle }}\">{{ x.level }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"{{ x.qStyle }}\">{{ x.q }}<\u002Fdiv>\n        <sc-if value=\"{{ x.hasItems }}\">\n          <div style=\"margin-top:10px;display:flex;flex-direction:column;gap:5px;background:#f7f5ef;border-radius:12px;padding:11px 14px\">\n            <sc-for list=\"{{ x.items }}\" as=\"it\">\n              <div style=\"{{ x.itemStyle }}\">{{ it }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ x.hasTail }}\">\n          <div style=\"{{ x.tailStyle }}\">{{ x.tail }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:12px\">\n          <sc-for list=\"{{ x.opts }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <div style=\"{{ o.style }}\">\n              <span style=\"{{ o.badgeStyle }}\">{{ o.letter }}<\u002Fspan>\n              <span style=\"{{ o.textStyle }}\">{{ o.text }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:12px;background:#faf8f2;border:1px solid rgba(25,24,19,.08);border-radius:12px;padding:13px 15px\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin-bottom:5px\">\n            <span style=\"font-size:12.5px;font-weight:700;color:#14713f\">ตอบ {{ x.answer }}<\u002Fspan>\n            <span style=\"{{ x.refStyle }}\">{{ x.ref }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"{{ x.explStyle }}\">{{ x.explanation }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <sc-if value=\"{{ hasNextSet }}\">\n      <button sc-camel-on-click=\"{{ nextSet }}\" style=\"{{ nextSetStyle }}\" style-hover=\"filter:brightness(1.08)\">{{ nextSetLabel }}<\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isResult }}\">\n<div style=\"max-width:860px;margin:0 auto;padding:44px 18px 64px\">\n  <div style=\"background:#fff;border:1px solid rgba(25,24,19,.09);border-radius:20px;padding:34px 24px;text-align:center;animation:hubIn .25s ease\">\n    <div style=\"font-size:13px;color:#8a8577;font-weight:500\">{{ sessionTitle }}<\u002Fdiv>\n    <div style=\"display:flex;align-items:baseline;justify-content:center;gap:8px;margin:14px 0 4px\">\n      <span style=\"font-size:58px;font-weight:700;line-height:1;letter-spacing:-.02em\">{{ resPct }}<\u002Fspan>\n      <span style=\"font-size:22px;font-weight:600;color:#8a8577\">%<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:15px;color:#6c6a60\">ตอบถูก {{ resCorrect }} จาก {{ resTotal }} ข้อ<\u002Fdiv>\n    <div style=\"{{ resBannerStyle }}\">{{ resMessage }}<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:26px\">\n      <button sc-camel-on-click=\"{{ retry }}\" style=\"{{ retryStyle }}\" style-hover=\"filter:brightness(1.08)\">ทำชุดนี้ใหม่อีกครั้ง<\u002Fbutton>\n      <sc-if value=\"{{ hasResWrong }}\">\n        <button sc-camel-on-click=\"{{ retryWrong }}\" style=\"padding:15px;font-size:15.5px;font-weight:600;border:1px solid rgba(25,24,19,.14);border-radius:13px;background:#fff;color:#191813;cursor:pointer\" style-hover=\"background:#faf8f2\">ทบทวนเฉพาะข้อที่ตอบผิด ({{ resWrong }} ข้อ)<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ hasResKey }}\">\n        <button sc-camel-on-click=\"{{ resKey }}\" style=\"padding:15px;font-size:15.5px;font-weight:600;border:1px solid rgba(25,24,19,.14);border-radius:13px;background:#fff;color:#191813;cursor:pointer\" style-hover=\"background:#faf8f2\">ดูเฉลยทั้งชุด<\u002Fbutton>\n      <\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ goHome }}\" style=\"padding:15px;font-size:15.5px;font-weight:600;border:1px solid rgba(25,24,19,.14);border-radius:13px;background:#fff;color:#191813;cursor:pointer\" style-hover=\"background:#faf8f2\">เลือกชุดข้อสอบใหม่<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;textSize&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;ปกติ&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;เล็ก&quot;,&quot;ปกติ&quot;,&quot;ใหญ่&quot;]},&quot;instantFeedback&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nconst KEY = 'taxhub_v1';\nconst LETTERS = ['ก', 'ข', 'ค', 'ง'];\nconst SIZES = [10, 20, 50, 0];\nconst LVL = {'ง่าย': '#14713f', 'กลาง': '#8a6410', 'ยาก': '#a62828'};\nconst fmt = n => n.toLocaleString('en-US');\n\nclass Component extends DCLogic {\n  state = {view: 'home', group: 0, queue: [], idx: 0, title: '', setId: null, gridOpen: false, query: '', ready: false, log: {}, keySet: null, keyFilter: ''};\n\n  componentDidMount() {\n    this.store = Object.assign({answers: {}, starred: {}, history: [], pos: {}, group: 0}, this.read());\n    const boot = () => {\n      if (!window.TAX_DATA) return setTimeout(boot, 60);\n      this.groups = window.TAX_DATA;\n      this.map = {}; this.setById = {};\n      this.groups.forEach((g, gi) => g.sets.forEach(s => {\n        s.gi = gi; this.setById[s.id] = s;\n        s.qs.forEach(q => { this.map[s.id + ':' + q.n] = {s, q}; });\n      }));\n      this.setState({ready: true, group: this.store.group || 0});\n    };\n    boot();\n    this.onKey = e => {\n      if (this.state.view !== 'quiz' || e.target.tagName === 'INPUT') return;\n      if (e.key === 'ArrowRight') this.next();\n      else if (e.key === 'ArrowLeft') this.prev();\n      else if (['1', '2', '3', '4'].indexOf(e.key) >= 0) this.choose(+e.key - 1);\n    };\n    window.addEventListener('keydown', this.onKey);\n  }\n  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); }\n  read() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }\n  persist() { try { localStorage.setItem(KEY, JSON.stringify(this.store)); } catch (e) {} }\n  fs() {\n    const t = this.props.textSize || 'ปกติ';\n    return t === 'ใหญ่' ? {q: 19, o: 16.5, e: 15.5} : t === 'เล็ก' ? {q: 16, o: 14.5, e: 13.5} : {q: 17.5, o: 15.5, e: 14.5};\n  }\n  top() { window.scrollTo(0, 0); }\n  label(s) { return s.scope + ' · ' + s.title; }\n\n  start(keys, title, at, setId) {\n    this.setState({view: 'quiz', queue: keys, idx: at || 0, title, setId: setId || null, log: {}, gridOpen: false});\n    this.top();\n  }\n  startSet(s, n) { const k = s.qs.map(q => s.id + ':' + q.n); this.start(n ? k.slice(0, n) : k, this.label(s), 0, s.id); }\n  resume(s) { const k = s.qs.map(q => s.id + ':' + q.n); this.start(k, this.label(s), Math.min(this.store.pos[s.id] || 0, k.length - 1), s.id); }\n  startFiltered(fn, title) {\n    const g = this.groups[this.state.group], keys = [];\n    g.sets.forEach(s => s.qs.forEach(q => { const k = s.id + ':' + q.n; if (fn(k)) keys.push(k); }));\n    if (keys.length) this.start(keys, title, 0, null);\n  }\n  openKey(id, filter) { this.setState({view: 'key', keySet: id, keyFilter: filter || ''}); this.top(); }\n  choose(i) {\n    const k = this.state.queue[this.state.idx];\n    if (!k || this.state.log[k] !== undefined) return;\n    this.store.answers[k] = i; this.persist();\n    this.setState({log: Object.assign({}, this.state.log, {[k]: i})});\n  }\n  jump(i) { this.setState({idx: i, gridOpen: false}); this.top(); }\n  prev() { if (this.state.idx > 0) this.jump(this.state.idx - 1); }\n  next() {\n    const s = this.state;\n    if (s.idx < s.queue.length - 1) {\n      if (s.setId) { this.store.pos[s.setId] = s.idx + 1; this.persist(); }\n      this.jump(s.idx + 1);\n    } else this.finish();\n  }\n  finish() {\n    const s = this.state; let c = 0, n = 0;\n    s.queue.forEach(k => { const a = s.log[k]; if (a === undefined) return; n++; if (a === this.map[k].q.a) c++; });\n    if (s.setId && this.store.pos[s.setId]) { delete this.store.pos[s.setId]; }\n    if (n) this.store.history = [{t: s.title, c, n: s.queue.length, d: Date.now()}].concat(this.store.history).slice(0, 15);\n    this.persist();\n    this.setState({view: 'result', gridOpen: false}); this.top();\n  }\n  pill(on, A) {\n    return 'flex:none;padding:7px 13px;min-height:36px;font-size:13.5px;font-weight:600;border-radius:99px;cursor:pointer;white-space:nowrap;border:1px solid ' + (on ? A : 'rg
